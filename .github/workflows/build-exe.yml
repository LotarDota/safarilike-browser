name: Build Windows EXE

on:
  push:
    branches: [ "devin/1777211476-botva-land-stats", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --onefile --windowed --name "BotvaLandStats" --icon NONE botva_land_stats_gui.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BotvaLandStats-Windows
          path: dist/BotvaLandStats.exe
